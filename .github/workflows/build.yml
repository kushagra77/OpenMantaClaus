name: ROS 2 Humble Build & Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ros:humble

    steps:
    - uses: actions/checkout@v4

    - name: Initialize rosdep and install Python dependencies
      run: |
        apt-get update
        apt-get install -y python3-pip python3-rosdep
        rosdep init || true
        rosdep update
        pip3 install ai-edge-litert transforms3d

    - name: Install ROS dependencies
      run: |
        rosdep install --from-paths src --ignore-src -y --rosdistro humble

    - name: Build Workspace
      run: |
        . /opt/ros/humble/setup.sh
        colcon build --symlink-install

    - name: Test Workspace
      run: |
        . /opt/ros/humble/setup.sh
        colcon test
        colcon test-result --verbose || true
