brain:
  ros__parameters:
    mission:
      main_run: false  # OVERRIDE IN LAUNCH: Chooses the full arena mission sequence when true and the qualifier sequence when false.
      qual_sequence: ["qual_gate", "-qual_gate"]  # Ordered task commands for the qualification mission.
    setup:
      target_depth_m: 0.6  # Target dive depth sent to MAVROS during mission setup, in meters.
      start_delay_s: 7  # Delay after initial depth command before enabling ALT_HOLD and arming, in seconds.
      setpoint_publish_count: 10  # Number of repeated depth setpoint publishes used to latch the MAVROS target.
      setpoint_publish_interval_ms: 50  # Delay between repeated depth setpoint publishes, in milliseconds.